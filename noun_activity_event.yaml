version: 1
kind: 活動・イベント・企画
comment:
  - 配信企画、イベント、コラボ、キャンペーン、ライブ、スポーツ大会、ゲーム大会、展示会、祭り、記念日など
  - 期日を限定して開催されるもの
  - 配信者の活動周年、誕生日、登録者数達成、衣装公開などの記念日はここへ分類する。記念グッズ、記念ボイス、フルセット、ぬいぐるみなどの商品名は、対応する記念日の別名として登録する
  - ライブのBlu-ray、DVD、BDなどの映像・音声商品名は、元ライブイベントの別名として登録する
