name: Validate and merge noun review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: noun-review-auto-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'noun-review/')
    runs-on: ubuntu-latest

    steps:
      # pull_request_targetでもrefを省略せず、信頼済みのdefault branchだけを取得する。
      - name: Check out trusted workflow dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Install trusted validator dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Test trusted validator
        working-directory: trusted
        run: npm test

      - name: Create repository token
        id: repository-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Read changed file list
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' | jq -R -s 'split("\n") | map(select(length > 0))' > "$RUNNER_TEMP/changed-files.json"

      - name: Rebase candidate branch onto latest default branch
        id: rebase
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          {
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" candidate
            git -C candidate fetch origin "${DEFAULT_BRANCH}"
            git -C candidate fetch origin "pull/${PR_NUMBER}/head:refs/remotes/origin/noun-review-candidate"
            git -C candidate checkout -B validation-head "origin/noun-review-candidate"
            git -C candidate config user.name "github-actions[bot]"
            git -C candidate config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C candidate rev-parse HEAD > "$RUNNER_TEMP/original-head-sha"
            git -C candidate rev-parse "origin/${DEFAULT_BRANCH}" > "$RUNNER_TEMP/validated-base-sha"

            if git -C candidate rebase "origin/${DEFAULT_BRANCH}"; then
              :
            else
              git -C candidate rebase --abort
              # 追加だけの辞書PRは末尾競合をunionで併合できる。削除・移動を含むものは
              # 意図しない復元を避けるため、従来どおり人手で競合を解消する。
              if git -C candidate diff --numstat "${PR_BASE_SHA}...origin/noun-review-candidate" \
                | awk '$2 != 0 { exit 1 }'; then
                echo "Ordinary rebase conflicted; retrying additive dictionary changes with the union strategy."
                git -C candidate rebase --merge -X union "origin/${DEFAULT_BRANCH}"
              else
                echo "The PR contains deleted lines, so union rebase is not permitted." >&2
                exit 1
              fi
            fi

            if [ "$(git -C candidate rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/original-head-sha")" ]; then
              echo "rebased=false" >> "$GITHUB_OUTPUT"
            else
              echo "rebased=true" >> "$GITHUB_OUTPUT"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/rebase.log"

      - name: Validate PR metadata and candidate dictionary
        id: validate
        if: steps.rebase.outcome == 'success'
        continue-on-error: true
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -o pipefail
          node trusted/validator.js \
            --directory candidate \
            --event "$EVENT_PATH" \
            --changed-files "$RUNNER_TEMP/changed-files.json" \
            --expected-author '${{ steps.repository-token.outputs.app-slug }}[bot]' \
            2>&1 | tee "$RUNNER_TEMP/validation.log"

      - name: Report rebase or validation failure
        if: steps.rebase.outcome == 'failure' || steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ '${{ steps.rebase.outcome }}' = 'failure' ]; then
            LOG_PATH="$RUNNER_TEMP/rebase.log"
            MESSAGE='最新default branchへのリベースに失敗しました。PRはマージしていません。'
          else
            LOG_PATH="$RUNNER_TEMP/validation.log"
            MESSAGE='自動マージ前の辞書検証に失敗しました。PRはマージしていません。'
          fi
          {
            echo "$MESSAGE"
            echo
            echo '```text'
            head -c 60000 "$LOG_PATH"
            echo
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh api --method POST "/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$RUNNER_TEMP/comment.md"
          exit 1

      - name: Update rebased pull request branch
        if: steps.rebase.outcome == 'success' && steps.validate.outcome == 'success' && steps.rebase.outputs.rebased == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ORIGINAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C candidate push \
            --force-with-lease="refs/heads/${HEAD_REF}:${ORIGINAL_HEAD_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
          echo 'PR branch was rebased and updated. The synchronize event will validate and merge it in the next run.'

      - name: Merge validated pull request
        if: steps.rebase.outcome == 'success' && steps.validate.outcome == 'success' && steps.rebase.outputs.rebased != 'true'
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          validated_base=$(cat "$RUNNER_TEMP/validated-base-sha")
          current_base=$(gh api "/repos/${REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')
          if [ "$validated_base" != "$current_base" ]; then
            echo "Default branch changed after validation; refusing to merge an unvalidated combination."
            exit 1
          fi
          result=$(gh api --method PUT "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA")
          echo "$result" | jq -e '.merged == true'

      - name: Delete merged branch
        if: steps.rebase.outcome == 'success' && steps.validate.outcome == 'success' && steps.rebase.outputs.rebased != 'true'
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api --method DELETE "/repos/${REPOSITORY}/git/refs/heads/${HEAD_REF}"
